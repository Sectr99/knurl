[package]
name = "knurl"
version = "0.1.0"
edition = "2024"

[dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
native-windows-gui = { version = "1.0.13", features = ["tray-notification", "message-window", "menu", "listbox", "cursor", "high-dpi"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Controls", "Win32_System_Variant", "Win32_UI_Input"] }
wry = "0.57.0"

[build-dependencies]
embed-manifest = "1.5.1"
embed-resource = "3.0.12"
