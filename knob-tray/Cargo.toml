[package]
name = "knob-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
native-windows-gui = { version = "1.0.13", features = ["tray-notification", "message-window", "menu", "listbox", "cursor", "high-dpi"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

[build-dependencies]
embed-manifest = "1.5.1"
